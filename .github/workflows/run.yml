name: Check Telegram & Send to Bale

on:
  schedule:
  - cron: '*/20 * * * *'
  workflow_dispatch:      # قابلیت اجرای دستی برای تست

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install telethon requests

      - name: Run Bot
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          LOGIN_KEY: ${{ secrets.LOGIN_KEY }}
        run: python bot.py
